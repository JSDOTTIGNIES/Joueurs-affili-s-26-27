<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JS Dottignies - Fiche joueur</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-brand">
        <img class="club-logo" src="logo-js-dottignies.png" alt="Logo JS Dottignies Basket-Ball">
        <div class="hero-copy">
          <div class="eyebrow">JS DOTTIGNIES</div>
          <h1>Affiliés 26/27</h1>
          <p>JS Dottignies — ONE TEAM • Fiche joueur saison 2026–2027</p>
        </div>
      </div>
      <a class="admin-link" href="admin.html">Espace admin</a>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <form id="playerForm">
        <div class="grid">
          <label>Équipe <span class="required-star">*</span>
            <select id="team" required></select>
          </label>

          <label>Nom et prénom <span class="required-star">*</span>
            <input id="fullName" type="text" autocomplete="name" required>
          </label>


          <label class="full photo-field">Photo du joueur <span class="required-star">*</span>
            <input id="playerPhoto" type="file" required accept="image/jpeg,image/png,image/webp">
            <small>JPG, PNG ou WEBP — 5 Mo maximum.</small>
            <div id="photoPreviewWrap" class="photo-preview-wrap hidden">
              <img id="photoPreview" class="photo-preview" alt="Aperçu de la photo du joueur">
              <button id="removePhoto" class="mini" type="button">Retirer la photo</button>
            </div>
          </label>

          <label class="full">Adresse <span class="required-star">*</span>
            <input id="address" type="text" autocomplete="street-address" required>
          </label>

          <label>Code postal <span class="required-star">*</span>
            <input id="postalCode" type="text" inputmode="numeric" autocomplete="postal-code" required>
          </label>

          <label>Ville <span class="required-star">*</span>
            <input id="city" type="text" autocomplete="address-level2" required>
          </label>

          <label>Date de naissance <span class="required-star">*</span>
            <input id="birthDate" type="date" required>
          </label>

          <label>E-mail <span class="required-star">*</span>
            <input id="email" type="email" autocomplete="email" required>
          </label>

          <label>N° de téléphone <span class="required-star">*</span>
            <input id="phone" type="tel" autocomplete="tel" required>
          </label>

          <label>Téléphone d'urgence 1 <span class="required-star">*</span>
            <input id="emergency1" type="tel" required>
          </label>

          <label>Téléphone d'urgence 2 <span class="optional-label">(facultatif)</span>
            <input id="emergency2" type="tel">
          </label>
        </div>

        <div class="delegate-box">
          <label class="check-row">
            <input id="isDelegate" type="checkbox">
            <span>Délégué ou coach</span>
          </label>
          <small>À cocher pour une personne enregistrée comme délégué ou coach.</small>
        </div>

        <div class="medical-box" id="medicalBox">
          <label class="check-row">
            <input id="certificateGiven" type="checkbox">
            <span>Certificat médical remis au coach</span>
          </label>

          <label class="certificate-upload-field">
            <span>Certificat médical <span class="required-star">*</span></span>
            <input id="certificateFile" type="file" accept="image/jpeg,image/png,image/webp,application/pdf">
            <small>Obligatoire uniquement si le certificat n’a pas été remis au coach. JPG, PNG, WEBP ou PDF — 10 Mo maximum.</small>

            <div id="certificatePreviewWrap" class="certificate-preview-wrap hidden">
              <img id="certificatePreview" class="certificate-preview hidden" alt="Aperçu du certificat">
              <div id="certificatePdfPreview" class="certificate-pdf-preview hidden">PDF sélectionné</div>
              <button id="removeCertificate" class="mini" type="button">Retirer le fichier</button>
            </div>
          </label>
        </div>

        <div class="contribution-box" id="contributionBox">
          <label>
            <span>Statut de la cotisation <span class="required-star">*</span></span>
            <select id="contributionStatus" required>
              <option value="unpaid">Non payée</option>
              <option value="paid_partial">Partiellement payée</option>
              <option value="paid_total">Totalement payée</option>
            </select>
          </label>
        </div>

        <label class="check-row consent">
          <input id="consent" type="checkbox" required>
          <span>Je confirme que les informations encodées sont correctes et peuvent être utilisées par la JS Dottignies pour la gestion administrative du club. <span class="required-star">*</span></span>
        </label>

        <div class="required-note"><span class="required-star">*</span> Champs obligatoires</div>
        <button id="submitBtn" class="primary" type="submit">Envoyer mes informations</button>
        <div id="status" class="status" role="status"></div>
      </form>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
